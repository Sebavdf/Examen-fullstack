server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/fullrepar_auth
    username: postgres
    password: admin123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

# Documentación interactiva (Swagger UI) para probar los endpoints desde el navegador
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html


# IMPORTANTE: "jwt.secret" debe ser EXACTAMENTE igual en auth-service y en bff-gateway,
# porque ambos usan la misma llave simétrica (HMAC) para firmar/validar el token.
# En un entorno real esto se movería a una variable de entorno / secret manager.
jwt:
  secret: ${JWT_SECRET:fullrepar-super-secret-key-for-hs256-signing-2026-change-me}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000} # 1 hora